services:
  postgres:
    image: postgres:16-alpine
    container_name: db_admin_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_admin
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: db_admin_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: db_admin_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      # Подключения к «удалённым» БД с хостом localhost из UI → реальный Postgres в compose
      DOCKER_PG_HOST: postgres
    depends_on:
      - postgres
      - redis
    volumes:
      - .:/app

volumes:
  postgres_data:
